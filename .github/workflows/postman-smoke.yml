name: Postman Smoke Tests

on:
  workflow_dispatch:
    inputs:
      run_scope:
        description: Select whether to run the smoke folder or the full collection
        required: true
        default: all
        type: choice
        options:
          - smoke
          - all
      jira_key:
        description: Optional Jira issue key to comment/transition when running manually
        required: false
        default: ""
      force_transition:
        description: Optional. When set to 'done', force transitioning the resolved Jira issue to Done.
        required: false
        default: ""
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - closed
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read

concurrency:
  group: postman-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Jira key from branch/PR/commit
        id: extract_jira
        run: |
          $parts = @(
            "${{ github.event.pull_request.title }}",
            "${{ github.head_ref }}",
            "${{ github.ref_name }}",
            "${{ github.event.head_commit.message }}",
            "${{ github.event.inputs.jira_key }}"
          )
          $source = ($parts -join ' ')

          if ($source -match '([A-Z][A-Z0-9]+-\d+)') {
            $jiraKey = $Matches[1]
            "jira_key=$jiraKey" >> $env:GITHUB_OUTPUT
            Write-Host "Detected Jira key: $jiraKey"
          } else {
            "jira_key=" >> $env:GITHUB_OUTPUT
            Write-Host "No Jira key detected from branch/PR/commit context."
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Backend image
        uses: docker/build-push-action@v5
        with:
          context: Waste-Recycling-Platform/backend
          file: Waste-Recycling-Platform/backend/Dockerfile
          load: true
          tags: waste-recycling-platform-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start backend stack
        run: docker compose -f ./Waste-Recycling-Platform/docker-compose.yml up -d db backend

      - name: Show container status
        run: docker compose -f ./Waste-Recycling-Platform/docker-compose.yml ps

      - name: Wait for API health
        run: |
          $maxAttempts = 60
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            $attempt++
            try {
              Write-Host "Health check attempt $attempt/$maxAttempts..."
              $response = Invoke-WebRequest -Uri 'http://localhost:8080/api/health' -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host 'API is healthy ✓'
                exit 0
              }
            } catch {
              if ($attempt -eq $maxAttempts) {
                Write-Host "Health check failed after $maxAttempts attempts"
                throw
              }
              Write-Host "Waiting... (next attempt in 5s)"
              Start-Sleep -Seconds 5
            }
          }

      - name: Install Newman
        run: npm install -g newman newman-reporter-junitfull newman-reporter-allure

      - name: Decide Postman run scope
        id: postman_scope
        run: |
          $scope = '${{ github.event.inputs.run_scope }}'

          if ([string]::IsNullOrWhiteSpace($scope)) {
            $scope = 'smoke'
          }

          # Schedule (daily cron) runs full collection for complete Allure reports
          if ('${{ github.event_name }}' -eq 'schedule') {
            $scope = 'all'
          }
          # PR events stay smoke (fast gate)
          elseif ('${{ github.event_name }}' -ne 'workflow_dispatch') {
            $scope = 'smoke'
          }

          "scope=$scope" >> $env:GITHUB_OUTPUT
          Write-Host "Postman run scope: $scope"

      - name: Pre-login — capture JWT tokens for all roles
        id: prelogin
        continue-on-error: true
        run: |
          $base = "http://localhost:8080"
          # Seed password from Program.cs (SEED_PASSWORD env or default)
          $seedPwd = "S33dP@ss!2026"

          function Get-Token($email, $password) {
            try {
              $body = @{ email = $email; password = $password } | ConvertTo-Json
              $resp = Invoke-RestMethod -Method POST -Uri "$base/api/auth/login" `
                -ContentType "application/json" -Body $body -TimeoutSec 10 -ErrorAction Stop
              return $resp.token
            } catch {
              Write-Host "::warning::Login failed for $email — $($_.Exception.Message)"
              return ""
            }
          }

          # Login with the actual seeded accounts from Program.cs
          $citizenToken    = Get-Token "nguyenvana@gmail.com"    $seedPwd
          $enterpriseToken = Get-Token "greenlife@gmail.com"     $seedPwd
          $adminToken      = Get-Token "admin@gmail.com"         $seedPwd
          $collectorToken  = Get-Token "collector1@gmail.com"    $seedPwd

          if (-not $citizenToken) {
            Write-Host "::warning::Citizen token empty — the Postman collection's Auth folder will register + login fresh accounts"
          }

          # Export để dùng ở bước tiếp
          "citizenToken=$citizenToken"    >> $env:GITHUB_OUTPUT
          "enterpriseToken=$enterpriseToken" >> $env:GITHUB_OUTPUT
          "adminToken=$adminToken"        >> $env:GITHUB_OUTPUT
          "collectorToken=$collectorToken" >> $env:GITHUB_OUTPUT

          Write-Host "citizenToken    = $(if($citizenToken){'✅ obtained'}else{'❌ empty'})"
          Write-Host "enterpriseToken = $(if($enterpriseToken){'✅ obtained'}else{'❌ empty'})"
          Write-Host "adminToken      = $(if($adminToken){'✅ obtained'}else{'❌ empty'})"
          Write-Host "collectorToken  = $(if($collectorToken){'✅ obtained'}else{'❌ empty'})"

      - name: Run Postman collection
        id: run_postman
        continue-on-error: true
        run: |
          $scope = '${{ steps.postman_scope.outputs.scope }}'
          $args = @(
            'run',
            './Waste-Recycling-Platform/postman/WastePlatform.professional.postman_collection.json',
            '-e', './Waste-Recycling-Platform/postman/WastePlatform.professional.postman_environment.json',
            '--env-var', 'baseUrl=http://localhost:8080',
            '--env-var', 'citizenToken=${{ steps.prelogin.outputs.citizenToken }}',
            '--env-var', 'enterpriseToken=${{ steps.prelogin.outputs.enterpriseToken }}',
            '--env-var', 'adminToken=${{ steps.prelogin.outputs.adminToken }}',
            '--env-var', 'collectorToken=${{ steps.prelogin.outputs.collectorToken }}',
            '--env-var', 'managementToken=${{ steps.prelogin.outputs.adminToken }}',
            '--reporters', 'cli,junit,json,allure',
            '--reporter-junit-export', './TestResults/postman-junit.xml',
            '--reporter-json-export', './TestResults/postman-report.json',
            '--reporter-allure-export', './TestResults/postman-allure-results'
          )

          if ($scope -eq 'smoke') {
            $args += @('--folder', '00 - Smoke & Public')
          }

          Write-Host "Running Newman scope: $scope"
          & newman @args
          $exit = $LASTEXITCODE
          Write-Host "newman_exit=$exit"
          echo "newman_exit=$exit" >> $env:GITHUB_OUTPUT
          if ($exit -ne 0) {
            Write-Host "::warning::Newman exited with code $exit (tests may have failures). Collecting artifacts and continuing."
          }

      - name: Export Postman Allure results
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path Waste-Recycling-Platform/allure-results | Out-Null
          # Copy từ newman allure reporter (newman-reporter-allure)
          if (Test-Path ./TestResults/postman-allure-results) {
            Copy-Item -Recurse -Force ./TestResults/postman-allure-results/* Waste-Recycling-Platform/allure-results/
            Write-Host "✅ Copied Newman Allure results from TestResults/postman-allure-results"
          }
          # Fallback: nếu newman tạo ở thư mục gốc
          if (Test-Path ./allure-results) {
            Copy-Item -Recurse -Force ./allure-results/* Waste-Recycling-Platform/allure-results/
            Write-Host "✅ Copied Newman Allure results from ./allure-results (fallback)"
          }
          # Write executor metadata so Executors panel shows origin
          $exec = [ordered]@{
            name = 'GitHub Actions'
            type = 'github'
            url = "https://github.com/${{ github.repository }}"
            buildName = "${{ github.workflow }} #${{ github.run_number }}"
            buildUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            reportName = 'Postman API Tests'
            reportUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          $exec | ConvertTo-Json | Out-File -FilePath Waste-Recycling-Platform/allure-results/executor.json -Encoding utf8

      - name: Upload Postman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-smoke-results
          path: |
            TestResults
            **/postman-junit.xml
            **/postman-report.json

      - name: Resolve Jira Issue Key
        id: resolve_jira
        if: always() && steps.extract_jira.outputs.jira_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          EXTRACTED_KEY: ${{ steps.extract_jira.outputs.jira_key }}
        run: |
          if (-not $env:JIRA_BASE_URL -or -not $env:JIRA_API_EMAIL -or -not $env:JIRA_API_TOKEN) { 
            Write-Host "::warning::Missing Jira credentials in GitHub Secrets. Skipping Jira integration."
            exit 0 
          }
          $email = $env:JIRA_API_EMAIL.Trim()
          $token = $env:JIRA_API_TOKEN.Trim()
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($email):$($token)"))
          $headers = @{ Authorization = "Basic $auth"; Accept = "application/json"; "Content-Type" = "application/json" }
          $base = $env:JIRA_BASE_URL.Trim().TrimEnd('/')
          $realKey = $env:EXTRACTED_KEY.Trim()
          
          Write-Host "::notice::Using Jira Base URL: $base"
          $emailParts = $email -split "@"
          Write-Host "::notice::Using Email: $($emailParts[0].Substring(0, [math]::Min(3, $emailParts[0].Length)))***@$($emailParts[1])"
          Write-Host "::notice::Looking for Key: '$realKey'"
          
          try {
            $resp = Invoke-RestMethod -Method GET -Uri "$base/rest/api/3/issue/$realKey?fields=key" -Headers $headers -ErrorAction Stop
          } catch {
            Write-Host "::warning::First API call failed: $($_.Exception.Message)"
            Write-Host "$realKey is not a direct Issue ID or cannot be accessed. Searching by summary..."
            
            # The search query should search by key if we are looking for a key! But wait, JQL for key is 'key = KIEM-19' or 'text ~ KIEM-19'
            $jql = [uri]::EscapeDataString("key = `"$realKey`" OR summary ~ `"$realKey`"")
            try {
              $searchResp = Invoke-RestMethod -Method GET -Uri "$base/rest/api/3/search/jql?jql=$jql&fields=key" -Headers $headers -ErrorAction Stop
              if ($searchResp.issues.Count -gt 0) {
                 $realKey = $searchResp.issues[0].key
                 Write-Host "Resolved $env:EXTRACTED_KEY to real issue key $realKey via JQL search"
              } else {
                 Write-Host "::warning::Could not find any Jira issue matching $env:EXTRACTED_KEY. Skipping."
                 exit 0
              }
            } catch {
              Write-Host "::warning::Jira API search failed. The token may be invalid or the issue doesn't exist."
              Write-Host $_.Exception.Message
              exit 0
            }
          }
          Write-Host "Successfully resolved Jira Key: $realKey"
          "real_jira_key=$realKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Comment PASS result to Jira
        # Use the captured exit code so Jira status follows the real Newman result.
        if: always() && steps.run_postman.outputs.newman_exit == '0' && steps.resolve_jira.outputs.real_jira_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.resolve_jira.outputs.real_jira_key }}
        run: |
          if (-not $env:JIRA_BASE_URL -or -not $env:JIRA_API_EMAIL -or -not $env:JIRA_API_TOKEN) { Write-Host "Missing Jira credentials. Skipping."; exit 0 }
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $commentText = "Postman Smoke Tests PASSED for commit ${{ github.sha }}. Run: $runUrl"

          $body = @{
            body = @{
              type = "doc"
              version = 1
              content = @(
                @{
                  type = "paragraph"
                  content = @(
                    @{
                      type = "text"
                      text = $commentText
                    }
                  )
                }
              )
            }
          } | ConvertTo-Json -Depth 10

          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:JIRA_API_EMAIL):$($env:JIRA_API_TOKEN)"))
          $headers = @{ Authorization = "Basic $auth"; Accept = "application/json"; "Content-Type" = "application/json" }
          $url = "$($env:JIRA_BASE_URL.TrimEnd('/'))/rest/api/3/issue/$($env:JIRA_KEY)/comment"

          Invoke-RestMethod -Method POST -Uri $url -Headers $headers -Body $body | Out-Null
          Write-Host "Posted PASS result to Jira issue $($env:JIRA_KEY)"

      - name: Transition Jira issue status on PASS
        # Use the captured exit code so Jira status follows the real Newman result.
        if: always() && steps.run_postman.outputs.newman_exit == '0' && steps.resolve_jira.outputs.real_jira_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.resolve_jira.outputs.real_jira_key }}
        run: |
          if (-not $env:JIRA_BASE_URL -or -not $env:JIRA_API_EMAIL -or -not $env:JIRA_API_TOKEN) { Write-Host "Missing Jira credentials. Skipping."; exit 0 }
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:JIRA_API_EMAIL):$($env:JIRA_API_TOKEN)"))
          $headers = @{ Authorization = "Basic $auth"; Accept = "application/json"; "Content-Type" = "application/json" }

          $base = $env:JIRA_BASE_URL.TrimEnd('/')
          $transitionsUrl = "$base/rest/api/3/issue/$($env:JIRA_KEY)/transitions"

          function Transition-To ($Pattern) {
            $transResp = Invoke-RestMethod -Method GET -Uri $transitionsUrl -Headers $headers
            $target = $transResp.transitions | Where-Object { $_.to.name -match $Pattern } | Select-Object -First 1
            if ($target) {
              $body = @{ transition = @{ id = $target.id } } | ConvertTo-Json -Depth 5
              Invoke-RestMethod -Method POST -Uri $transitionsUrl -Headers $headers -Body $body | Out-Null
              Write-Host "Transitioned $env:JIRA_KEY to '$($target.to.name)'"
              return $true
            }
            return $false
          }

          $eventName = "${{ github.event_name }}"
          $donePattern = '(?i)^(Done|Resolved|Closed|Hoàn thành|Hoàn tất|Completed|Finished|Đã\s?xong)$'
          $inProgressPattern = '(?i)(In Progress|Đang làm|Processing|In Development|Doing|In Progressed)'

          # Allow manual force via workflow_dispatch input
          $forceFlag = "${{ github.event.inputs.force_transition }}"
          if (-not $forceFlag) { $forceFlag = '' }

          # Try to detect merged PRs robustly:
          try { $prMerged = "${{ github.event.pull_request.merged }}" } catch { $prMerged = '' }
          try { $headCommitMsg = "${{ github.event.head_commit.message }}" } catch { $headCommitMsg = '' }
          $isMergePush = $false
          if ($prMerged -eq 'true') { $isMergePush = $true }
          elseif ($headCommitMsg -and $headCommitMsg -match 'Merge pull request') { $isMergePush = $true }
          elseif ($forceFlag -eq 'done') { $isMergePush = $true }

          if (($eventName -eq 'pull_request' -and $prMerged -eq 'true') -or $isMergePush) {
            Write-Host "Detected merged PR (or forced). Attempting to transition $env:JIRA_KEY to Done..."
            if (-not (Transition-To $donePattern)) {
              Write-Host "Could not transition directly to Done. Trying to go to In Progress first..."
              if (Transition-To $inProgressPattern) {
                Write-Host "Successfully transitioned to In Progress. Now moving to Done..."
                if (-not (Transition-To $donePattern)) {
                   Write-Host "::warning::Still could not find a 'Done' transition after moving to 'In Progress'."
                }
              } else {
                 Write-Host "::warning::Could not find 'In Progress' or 'Done' transitions."
              }
            }
          } else {
            Write-Host "Event is push (non-merge). Attempting to transition $env:JIRA_KEY to In Progress..."
            if (-not (Transition-To $inProgressPattern)) {
               Write-Host "Could not find an 'In Progress' transition, or issue is already in Progress/Done."
            }
          }

      - name: Comment FAIL result to Jira
        # Use the captured exit code so Jira status follows the real Newman result.
        if: always() && steps.run_postman.outputs.newman_exit != '0' && steps.resolve_jira.outputs.real_jira_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.resolve_jira.outputs.real_jira_key }}
        run: |
          if (-not $env:JIRA_BASE_URL -or -not $env:JIRA_API_EMAIL -or -not $env:JIRA_API_TOKEN) { Write-Host "Missing Jira credentials. Skipping."; exit 0 }
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $commentText = "Postman Smoke Tests FAILED for commit ${{ github.sha }}. Fix required and re-run. Run: $runUrl"

          $body = @{
            body = @{
              type = "doc"
              version = 1
              content = @(
                @{
                  type = "paragraph"
                  content = @(
                    @{
                      type = "text"
                      text = $commentText
                    }
                  )
                }
              )
            }
          } | ConvertTo-Json -Depth 10

          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:JIRA_API_EMAIL):$($env:JIRA_API_TOKEN)"))
          $headers = @{ Authorization = "Basic $auth"; Accept = "application/json"; "Content-Type" = "application/json" }
          $url = "$($env:JIRA_BASE_URL.TrimEnd('/'))/rest/api/3/issue/$($env:JIRA_KEY)/comment"

          Invoke-RestMethod -Method POST -Uri $url -Headers $headers -Body $body | Out-Null
          Write-Host "Posted FAIL result to Jira issue $($env:JIRA_KEY)"

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f ./Waste-Recycling-Platform/docker-compose.yml logs backend

      - name: Debug Workflow State
        if: always()
        run: |
          Write-Host "extracted_jira_key: '${{ steps.extract_jira.outputs.jira_key }}'"
          Write-Host "resolved_real_jira_key: '${{ steps.resolve_jira.outputs.real_jira_key }}'"
          Write-Host "newman_exit: '${{ steps.run_postman.outputs.newman_exit }}'"
          Write-Host "run_postman outcome: '${{ steps.run_postman.outcome }}'"
          Write-Host "JIRA_BASE_URL is set: '${{ secrets.JIRA_BASE_URL != '' }}'"
          Write-Host "JIRA_API_EMAIL is set: '${{ secrets.JIRA_API_EMAIL != '' }}'"
          Write-Host "JIRA_API_TOKEN is set: '${{ secrets.JIRA_API_TOKEN != '' }}'"

      - name: Fail workflow when Newman tests fail
        if: always() && steps.run_postman.outputs.newman_exit != '0'
        run: |
          $exit = '${{ steps.run_postman.outputs.newman_exit }}'
          Write-Host "Newman exit code: $exit"

          # Parse Newman JSON report to check actual assertion failures
          $reportFile = Get-ChildItem -Path . -Filter 'postman-report.json' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($reportFile) {
            $report = Get-Content $reportFile.FullName | ConvertFrom-Json -ErrorAction SilentlyContinue
            if ($report) {
              $assertionsFailed = [int]($report.run.stats.assertions.failed)
              $assertionsTotal  = [int]($report.run.stats.assertions.total)
              $scriptsFailed    = [int]($report.run.stats.testScripts.failed)
              Write-Host "Assertions: $assertionsFailed / $assertionsTotal failed"
              Write-Host "Test-scripts with errors: $scriptsFailed"

              if ($assertionsFailed -eq 0) {
                Write-Host "::warning::Newman exit=$exit but 0 assertion failures. Treating as pass (test-script warnings only)."
                exit 0
              }
            }
          }

          Write-Host "::error::Newman tests have $assertionsFailed assertion failure(s). Quality gate FAILED."
          exit 1

      - name: Stop backend stack
        if: always()
        run: docker compose -f ./Waste-Recycling-Platform/docker-compose.yml down -v

      - name: Log Postman results to Jira
        if: always()
        shell: pwsh
        env:
          JIRA_BASE_URL:     ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:        ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN:    ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:  KIEM
          TEST_TYPE:         postman
          ALLURE_REPORT_URL: https://chi-trung.github.io/KCPM/report-main/
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW:   ${{ github.workflow }}
        run: |
          # Try to parse Newman summary JSON for pass/fail counts
          $summary = Get-ChildItem -Recurse -Filter "newman-summary*.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          $passed = 0; $failed = 0; $total = 0; $dur = ""
          if ($summary) {
            $json = Get-Content $summary.FullName | ConvertFrom-Json -ErrorAction SilentlyContinue
            if ($json) {
              $stats = $json.run.stats.assertions
              if ($stats) {
                $passed = [int]($stats.total - $stats.failed)
                $failed = [int]$stats.failed
                $total  = [int]$stats.total
              }
              $timings = $json.run.timings
              if ($timings) {
                $dur = [math]::Round($timings.completed / 1000)
              }
            }
          }
          $env:PASSED       = $passed
          $env:FAILED       = $failed
          $env:TOTAL        = $total
          $env:DURATION_SEC = $dur
          python scripts/jira_log_test_execution.py
          exit 0
