name: CI - API Tests with Allure Report

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Backend with Docker Compose
        run: |
          cd Waste-Recycling-Platform
          docker compose up -d backend
          echo "Waiting for backend and DB to initialize..."
          sleep 30 # Đợi 30s để đảm bảo db và backend khởi động xong

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman and Allure Reporter
        run: |
          npm install -g newman newman-reporter-allure

      - name: Run Postman Tests via Newman
        continue-on-error: true # Cho phép job tiếp tục ngay cả khi có test case bị fail
        run: |
          cd Waste-Recycling-Platform
          newman run "postman/WastePlatform API - Professional QA Suite.postman_collection.json" \
            -e "postman/WastePlatform.professional.postman_environment.json" \
            -r allure \
            --reporter-allure-export allure-results

      - name: Restore Allure History
        if: always()
        run: |
          mkdir -p allure-history
          git fetch origin gh-pages:gh-pages || true
          if [ -d gh-pages/history ]; then
            cp -R gh-pages/history/. allure-history/
          fi

      - name: Write Allure Environment
        if: always()
        run: |
          mkdir -p Waste-Recycling-Platform/allure-results
          cat > Waste-Recycling-Platform/allure-results/environment.properties <<EOF
          GIT_BRANCH=${{ github.ref }}
          GIT_COMMIT=${{ github.sha }}
          RUN_ID=${{ github.run_id }}
          RUN_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_NUMBER=${{ github.run_number }}
          RUNNER_OS=${{ runner.os }}
          WORKFLOW=${{ github.workflow }}
          EOF

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: Waste-Recycling-Platform/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
