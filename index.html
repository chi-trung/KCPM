<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KCPM Test Dashboard</title>
  <style>
    :root {
      --bg: #050b16;
      --bg2: #0a1322;
      --panel: rgba(12, 19, 34, 0.92);
      --panel-soft: rgba(255, 255, 255, 0.035);
      --line: rgba(255, 255, 255, 0.08);
      --text: #ecf3ff;
      --muted: #95a7c3;
      --accent: #7dd3fc;
      --accent2: #a78bfa;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(125, 211, 252, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(167, 139, 250, 0.13), transparent 24%),
        linear-gradient(160deg, var(--bg), var(--bg2));
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 34px 20px 42px; }
    .header { margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 58px); line-height: 1; letter-spacing: -0.03em; }
    .meta { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .section-title { margin: 32px 0 14px; color: var(--muted); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    .suite-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .suite-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 18px 18px 20px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.03));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      min-height: 110px;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .suite-card:hover { transform: translateY(-2px); border-color: rgba(125, 211, 252, 0.28); background: rgba(255,255,255,0.06); }
    .suite-icon {
      width: 42px; height: 42px; flex: 0 0 42px;
      display: grid; place-items: center;
      border-radius: 13px;
      background: rgba(255,255,255,0.06);
      font-size: 20px;
    }
    .suite-copy { min-width: 0; }
    .suite-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .suite-sub { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .member-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-width: 320px;
    }
    .member-item {
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .empty { color: var(--muted); padding: 12px 0; }
    @media (max-width: 920px) {
      .suite-grid { grid-template-columns: 1fr; }
      .member-list { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>KCPM Test Dashboard</h1>
      <div class="meta">Generated 2026-06-03 02:54 UTC</div>
    </div>

    <div class="section-title">Main Suites Report</div>
    <div class="suite-grid">
      <a class="suite-card" href="https://chi-trung.github.io/KCPM/report-main/"><div class="suite-icon">🧪</div><div class="suite-copy"><div class="suite-title">Postman API Test</div><div class="suite-sub">API report</div></div></a><a class="suite-card" href="https://chi-trung.github.io/KCPM/report-main/"><div class="suite-icon">⚙️</div><div class="suite-copy"><div class="suite-title">xUnit Backend Test</div><div class="suite-sub">Backend report</div></div></a>
    </div>

    <div class="section-title">Team Members</div>
    <div class="member-list">
      <div class="member-item">11A6_03_Đăng</div><div class="member-item">Hoàng Phụng</div><div class="member-item">Minh Phụng</div><div class="member-item">Nguyễn Chí Trung</div><div class="member-item">Thanh Duy</div>
    </div>
  </div>
</body>
</html>
