name: CI - API Tests with Allure Report

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: allure-gh-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start Backend with Docker Compose
        run: |
          cd Waste-Recycling-Platform
          docker compose up -d backend
          echo "Waiting for backend and DB to initialize..."
          sleep 30 # Đợi 30s để đảm bảo db và backend khởi động xong

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman and Allure Reporter
        run: |
          npm install -g newman newman-reporter-allure

      - name: Run Postman Tests via Newman
        continue-on-error: true # Cho phép job tiếp tục ngay cả khi có test case bị fail
        run: |
          cd Waste-Recycling-Platform
          newman run "postman/WastePlatform API - Professional QA Suite.postman_collection.json" \
            -e "postman/WastePlatform.professional.postman_environment.json" \
            -r allure \
            --reporter-allure-export allure-results

      - name: Checkout gh-pages history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure History
        if: always()
        run: |
          mkdir -p Waste-Recycling-Platform/allure-results/history
          if [ -d gh-pages/last-history ]; then
            cp -R gh-pages/last-history/. Waste-Recycling-Platform/allure-results/history/
          elif [ -d gh-pages/history ]; then
            cp -R gh-pages/history/. Waste-Recycling-Platform/allure-results/history/
          fi

      - name: Write Allure Environment
        if: always()
        run: |
          mkdir -p Waste-Recycling-Platform/allure-results
          cat > Waste-Recycling-Platform/allure-results/environment.properties <<EOF
          GIT_BRANCH=${{ github.ref }}
          GIT_COMMIT=${{ github.sha }}
          RUN_ID=${{ github.run_id }}
          RUN_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_NUMBER=${{ github.run_number }}
          RUNNER_OS=${{ runner.os }}
          WORKFLOW=${{ github.workflow }}
          EOF

      - name: Write executor metadata
        if: always()
        run: |
          mkdir -p Waste-Recycling-Platform/allure-results
          cat > Waste-Recycling-Platform/allure-results/executor.json <<'EOF'
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}",
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Allure Report",
            "reportUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: Waste-Recycling-Platform/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: Waste-Recycling-Platform/allure-results/history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true

      - name: Persist last-history to gh-pages
        if: always() && github.event_name != 'pull_request'
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf gh-pages/last-history || true
          mkdir -p gh-pages/last-history
          if [ -d allure-report/history ]; then
            cp -R allure-report/history/. gh-pages/last-history/ || true
          fi
          cd gh-pages
          git add -A
          if git diff --staged --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "Update last-history from run ${{ github.run_id }}"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:gh-pages
          fi
