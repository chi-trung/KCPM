name: CI CD Deploy Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Git ref to deploy
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/backend/**/*.csproj'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Restore backend tests
        run: dotnet restore ./Waste-Recycling-Platform/backend/tests/WastePlatform.Tests/WastePlatform.Tests.csproj

      - name: Run backend tests
        run: >
          dotnet test ./Waste-Recycling-Platform/backend/tests/WastePlatform.Tests/WastePlatform.Tests.csproj
          --configuration Release
          --settings ./Waste-Recycling-Platform/backend/tests/WastePlatform.Tests/WastePlatform.Tests.runsettings
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory ./TestResults

      - name: Generate backend Allure report
        if: always()
        run: |
          $resultsPath = ".\Waste-Recycling-Platform\backend\tests\WastePlatform.Tests\bin\Release\net8.0\allure-results"
          $reportPath = ".\TestResults\deploy-backend-allure-report"

          if (Test-Path $resultsPath) {
            @(
              "Environment=GitHub Actions Deploy",
              "Branch=${{ github.ref_name }}",
              "Workflow=${{ github.workflow }}",
              "RunNumber=${{ github.run_number }}",
              "Commit=${{ github.sha }}"
            ) | Set-Content -Path (Join-Path $resultsPath 'environment.properties') -Encoding utf8

            @{
              name = 'GitHub Actions'
              type = 'github'
              url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              buildOrder = [int]${{ github.run_number }}
              buildName = '${{ github.workflow }} #${{ github.run_number }}'
              reportName = 'WastePlatform Deploy Allure Report'
              branch = '${{ github.ref_name }}'
            } | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $resultsPath 'executor.json') -Encoding utf8

            allure generate $resultsPath --clean -o $reportPath
          } else {
            Write-Host "::warning::Allure results folder not found at $resultsPath"
          }

      - name: Upload quality-gate test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-quality-gate-results
          path: |
            TestResults
            **/*.trx

      - name: Upload backend Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-backend-allure-report
          path: |
            Waste-Recycling-Platform/backend/tests/WastePlatform.Tests/bin/Release/net8.0/allure-results
            TestResults/deploy-backend-allure-report

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Waste-Recycling-Platform/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Waste-Recycling-Platform/frontend
        run: npm install --omit=optional

      - name: Install Playwright browsers
        working-directory: Waste-Recycling-Platform/frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E gate
        working-directory: Waste-Recycling-Platform/frontend
        continue-on-error: true   # Frontend server không có trên CI → E2E sẽ fail nhưng không chặn deploy
        env:
          CODECEPT_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e:ci

      - name: Upload frontend E2E gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-frontend-e2e-artifacts
          path: |
            Waste-Recycling-Platform/frontend/output
            Waste-Recycling-Platform/frontend/allure-results
          retention-days: 30

      - name: Start backend stack for Postman gate
        run: docker compose -f ./Waste-Recycling-Platform/docker-compose.yml up -d --build db backend

      - name: Wait for API health before Postman gate
        run: |
          $maxAttempts = 60
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            $attempt++
            try {
              Write-Host "Health check attempt $attempt/$maxAttempts..."
              $response = Invoke-WebRequest -Uri 'http://localhost:8080/api/health' -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host 'API is healthy'
                exit 0
              }
            } catch {
              if ($attempt -eq $maxAttempts) {
                Write-Host "Health check failed after $maxAttempts attempts"
                throw
              }
              Start-Sleep -Seconds 5
            }
          }

      - name: Install Newman
        run: npm install -g newman newman-reporter-junitfull

      - name: Run Postman smoke gate
        run: |
          New-Item -ItemType Directory -Force -Path ./TestResults | Out-Null
          newman run ./Waste-Recycling-Platform/postman/WastePlatform.professional.postman_collection.json `
            -e ./Waste-Recycling-Platform/postman/WastePlatform.professional.postman_environment.json `
            --env-var baseUrl=http://localhost:8080 `
            --folder '00 - Smoke & Public' `
            --reporters cli,junit,json `
            --reporter-junit-export ./TestResults/deploy-postman-junit.xml `
            --reporter-json-export ./TestResults/deploy-postman-report.json

      - name: Upload Postman gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-postman-smoke-results
          path: |
            TestResults/deploy-postman-junit.xml
            TestResults/deploy-postman-report.json
          retention-days: 30

      - name: Stop backend stack after Postman gate
        if: always()
        run: docker compose -f ./Waste-Recycling-Platform/docker-compose.yml down -v

  deploy:
    name: Deploy To Server
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ github.event.inputs.deploy_ref || 'main' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/kcpm' }}
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
      ASPNETCORE_ENVIRONMENT: ${{ secrets.ASPNETCORE_ENVIRONMENT }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - name: Check Deployment Secrets
        id: check_secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Deployment skipped: Missing one or more required secrets (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY)."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script_stop: true
          envs: DEPLOY_REF,DEPLOY_PATH,DEPLOY_REPO_TOKEN,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,JWT_SECRET,JWT_ISSUER,JWT_AUDIENCE,ASPNETCORE_ENVIRONMENT,NEXT_PUBLIC_API_URL
          script: |
            set -e
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -d .git ]; then
              git clone "https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/${{ github.repository }}.git" .
            fi

            git fetch origin
            git checkout "$DEPLOY_REF"
            git reset --hard "origin/$DEPLOY_REF"

            cd Waste-Recycling-Platform

            cat > .env <<EOF
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE=${MYSQL_DATABASE}
            MYSQL_USER=${MYSQL_USER}
            MYSQL_PASSWORD=${MYSQL_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            JWT_ISSUER=${JWT_ISSUER}
            JWT_AUDIENCE=${JWT_AUDIENCE}
            ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            EOF

            docker compose -f docker-compose.yml up -d --build db backend frontend
            docker compose -f docker-compose.yml ps

            echo "Post-deploy verification: waiting for backend /api/health"
            HEALTH_OK=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/api/health; then
                HEALTH_OK=1
                break
              fi
              echo "Backend health check not ready yet ($i/30). Retrying in 5 seconds..."
              sleep 5
            done

            if [ "$HEALTH_OK" != "1" ]; then
              echo "Backend health check failed after deploy. Recent backend logs:"
              docker compose -f docker-compose.yml logs --tail=120 backend
              exit 1
            fi

            echo "Post-deploy backend health check passed."

      - name: Deployment summary
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "Deployment completed for ref: $DEPLOY_REF"
          echo "Server path: $DEPLOY_PATH"
