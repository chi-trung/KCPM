sonar.projectKey=chi-trung_KCPM
sonar.organization=chi-trung
sonar.projectName=KCPM (Waste Recycling Platform)
sonar.projectVersion=1.0

# Sources and tests
sonar.sources=frontend/src,frontend/public
sonar.tests=frontend/e2e
sonar.test.inclusions=frontend/e2e/**/*_test.js

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  frontend/out/**,\
  frontend/output/**,\
  allure-results/**,\
  allure-report/**,\
  **/coverage/**,\
  **/*.min.js

# Coverage (if generated)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# E2E test exclusions from coverage
sonar.coverage.exclusions=frontend/e2e/**
sonar.cpd.exclusions=frontend/e2e/**

# Language
sonar.language=js
sonar.sourceEncoding=UTF-8
