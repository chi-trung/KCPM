name: Create Jira Issues

on:
  workflow_dispatch:
    inputs:
      epic_issue_key:
        description: 'Optional existing Epic issue key to link tasks to'
        required: false
        default: ''

jobs:
  create_issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Jira import script
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          EPIC_ISSUE_KEY: ${{ github.event.inputs.epic_issue_key }}
        run: |
          python Waste-Recycling-Platform/scripts/create_jira_issues.py
