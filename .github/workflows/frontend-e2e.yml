name: Frontend E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Waste-Recycling-Platform/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Waste-Recycling-Platform/frontend/package-lock.json

      - name: Install dependencies
        run: npm install --omit=optional

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run CodeceptJS E2E
        continue-on-error: true
        env:
          CODECEPT_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e:ci

      - name: Write Allure executor metadata for E2E
        if: always()
        run: |
          mkdir -p ./allure-results
          cat > ./allure-results/executor.json << 'EOF'
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}",
            "buildName": "Frontend E2E #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "E2E Tests (CodeceptJS)"
          }
          EOF

          cat > ./allure-results/environment.properties << 'EOF'
          ENV=CI
          Framework=CodeceptJS + Playwright
          Browser=chromium
          GIT_SHA=${{ github.sha }}
          GITHUB_RUN_ID=${{ github.run_id }}
          RUNNER=${{ runner.os }}
          EOF

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure report (local check)
        if: always()
        run: |
          if [ -d ./allure-results ] && [ "$(ls -A ./allure-results)" ]; then
            allure generate ./allure-results -o ./allure-report --clean
            echo "✅ E2E Allure report generated"
          else
            echo "::warning::No E2E allure-results found — tests may not have run"
          fi

      - name: Upload E2E Allure results (for merging into main report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure-results-${{ github.run_number }}
          path: Waste-Recycling-Platform/frontend/allure-results
          retention-days: 30

      - name: Upload E2E artifacts (screenshots + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts-${{ github.run_number }}
          path: |
            Waste-Recycling-Platform/frontend/output
            Waste-Recycling-Platform/frontend/allure-report
          retention-days: 30

