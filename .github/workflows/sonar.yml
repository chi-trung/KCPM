name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Backend SonarCloud (.NET 8 + test coverage)
  # ─────────────────────────────────────────────────────────────
  sonar-backend:
    name: SonarCloud Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Waste-Recycling-Platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for SonarCloud blame data

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up JDK 17 (required by SonarScanner)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install coverlet for code coverage
        run: dotnet tool install --global coverlet.console || true

      - name: Restore dependencies
        run: dotnet restore backend/tests/WastePlatform.Tests/WastePlatform.Tests.csproj

      - name: Temporarily move sonar-project.properties (not supported by dotnet-sonarscanner)
        working-directory: Waste-Recycling-Platform
        run: |
          # dotnet-sonarscanner errors if sonar-project.properties is present in working dir
          if [ -f sonar-project.properties ]; then
            mv sonar-project.properties sonar-project.properties.bak
          fi

      - name: Begin SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"chi-trung_KCPM_backend" \
            /n:"chi-trung_KCPM_backend" \
            /o:"chi-trung" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/TestResults/**,**/Migrations/**,**/frontend/**,**/db/migrations/**,**/scripts/**" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml,**/TestResults/**/coverage.cobertura.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/**/*.trx" \
            /d:sonar.testExclusions="**/Tests/**" \
            /d:sonar.coverage.exclusions="**/Tests/**,**/Migrations/**"

      - name: Build backend
        run: |
          dotnet build backend/WastePlatform.sln --no-restore --configuration Release || \
          dotnet build Waste-Recycling-Platform.sln --no-restore --configuration Release || \
          dotnet build backend/tests/WastePlatform.Tests/WastePlatform.Tests.csproj --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test backend/tests/WastePlatform.Tests/WastePlatform.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=sonar-backend-tests.trx" \
            --results-directory ./TestResults/sonar \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover \
            || true

      - name: Debug - List coverage files
        if: always()
        run: |
          echo "=== Looking for coverage files ==="
          find ./TestResults -name "*.xml" -o -name "*.opencover*" 2>/dev/null || echo "No coverage files found"
          find . -name "coverage*" -path "*/TestResults/*" 2>/dev/null || echo "No coverage files in TestResults"

      - name: End SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Restore sonar-project.properties after .NET scan
        if: always()
        working-directory: Waste-Recycling-Platform
        run: |
          if [ -f sonar-project.properties.bak ]; then
            mv sonar-project.properties.bak sonar-project.properties
          fi

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Frontend SonarCloud (JS/TS + E2E sources)
  # ─────────────────────────────────────────────────────────────
  sonar-frontend:
    name: SonarCloud Frontend & E2E (JS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Waste-Recycling-Platform/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Waste-Recycling-Platform/frontend
        run: npm install

      - name: Run unit tests with coverage
        working-directory: Waste-Recycling-Platform/frontend
        continue-on-error: true
        run: npx vitest run --coverage

      - name: Fix lcov paths (absolute → relative src/...)
        if: always()
        working-directory: Waste-Recycling-Platform/frontend
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "=== Fixing paths in lcov.info ==="
            echo "Before fix (first 5 SF lines):"
            grep '^SF:' coverage/lcov.info | head -5
            perl -i -pe '
              if (/^SF:/) {
                s|\\|/|g;
                s|^SF:.+/src/|SF:src/|;
              }
            ' coverage/lcov.info
            echo "After fix (first 5 SF lines):"
            grep '^SF:' coverage/lcov.info | head -5
            echo "=== Done fixing lcov paths ==="
          else
            echo "No lcov.info found, skipping path fix"
          fi

      - name: Debug - Check coverage file
        if: always()
        working-directory: Waste-Recycling-Platform/frontend
        run: |
          echo "=== Checking for coverage files ==="
          ls -la coverage/ 2>/dev/null || echo "No coverage directory found"
          ls -la coverage/lcov.info 2>/dev/null || echo "No lcov.info found"
          head -20 coverage/lcov.info 2>/dev/null || echo "Cannot read lcov.info"

      - name: SonarCloud Scan (Frontend)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: Waste-Recycling-Platform
          args: >
            -Dsonar.projectKey=chi-trung_KCPM_frontend
            -Dsonar.organization=chi-trung
            "-Dsonar.projectName=chi-trung_KCPM_frontend"
            -Dsonar.sources=frontend/src
            -Dsonar.tests=frontend/src
            -Dsonar.test.inclusions=frontend/src/**/__tests__/**/*.tsx,frontend/src/**/__tests__/**/*.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.test.ts
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,frontend/out/**,frontend/output/**,allure-results/**,allure-report/**,**/coverage/**,frontend/e2e/**
            -Dsonar.coverage.exclusions=frontend/e2e/**,frontend/src/app/**
            -Dsonar.cpd.exclusions=frontend/e2e/**
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Combined project scan (keeps chi-trung_KCPM up to date)
  # ─────────────────────────────────────────────────────────────
  sonar-combined:
    name: SonarCloud Combined (KCPM)
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Waste-Recycling-Platform/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Waste-Recycling-Platform/frontend
        run: npm install

      - name: Run unit tests with coverage
        working-directory: Waste-Recycling-Platform/frontend
        continue-on-error: true
        run: npx vitest run --coverage

      - name: Fix lcov paths (absolute → relative src/...)
        if: always()
        working-directory: Waste-Recycling-Platform/frontend
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "=== Fixing paths in lcov.info ==="
            echo "Before fix (first 5 SF lines):"
            grep '^SF:' coverage/lcov.info | head -5
            perl -i -pe '
              if (/^SF:/) {
                s|\\|/|g;
                s|^SF:.+/src/|SF:src/|;
              }
            ' coverage/lcov.info
            echo "After fix (first 5 SF lines):"
            grep '^SF:' coverage/lcov.info | head -5
            echo "=== Done fixing lcov paths ==="
          else
            echo "No lcov.info found, skipping path fix"
          fi

      - name: Debug - Check coverage file
        if: always()
        working-directory: Waste-Recycling-Platform/frontend
        run: |
          echo "=== Checking for coverage files ==="
          ls -la coverage/ 2>/dev/null || echo "No coverage directory found"
          ls -la coverage/lcov.info 2>/dev/null || echo "No lcov.info found"
          head -20 coverage/lcov.info 2>/dev/null || echo "Cannot read lcov.info"

      - name: SonarCloud Scan (Combined)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: Waste-Recycling-Platform
          args: >
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.coverage.exclusions=frontend/e2e/**,frontend/src/app/**
