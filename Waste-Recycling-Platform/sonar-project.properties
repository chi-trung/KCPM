sonar.projectKey=chi-trung_KCPM
sonar.organization=chi-trung
sonar.projectName=KCPM (Waste Recycling Platform)
sonar.projectVersion=1.0

# Sources and tests
sonar.sources=frontend/src
sonar.tests=frontend/src
sonar.test.inclusions=frontend/src/**/__tests__/**/*.tsx,frontend/src/**/__tests__/**/*.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.test.ts

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  frontend/out/**,\
  frontend/output/**,\
  allure-results/**,\
  allure-report/**,\
  **/coverage/**,\
  **/*.min.js,\
  db/migrations/**,\
  scripts/**

# Coverage report path (generated by vitest --coverage on Linux CI)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Coverage exclusions — only exclude Next.js app/ pages (tested via E2E)
# components/shared, components/ui, hooks, lib, contexts all have unit tests
sonar.coverage.exclusions=\
  frontend/e2e/**,\
  frontend/src/app/**

sonar.cpd.exclusions=frontend/e2e/**

# Encoding
sonar.sourceEncoding=UTF-8
