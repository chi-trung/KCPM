name: Create Jira Issues

on:
  workflow_dispatch:
    inputs:
      epic_issue_key:
        description: 'Optional existing Epic issue key to link tasks to'
        required: false
        default: ''
      action:
        description: 'Action to perform'
        required: true
        default: 'post_all_evidence'
        type: choice
        options:
          - post_all_evidence
          - evidence
          - all_evidence
          - assign_all
          - cleanup_duplicates
          - create_issues
          - distribute_tasks

jobs:
  jira_automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ── SAFE actions (evidence only, no new issues created) ──

      - name: Post Sprint Evidence (KIEM-40 to KIEM-65)
        if: ${{ github.event.inputs.action == 'evidence' || github.event.inputs.action == 'post_all_evidence' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python scripts/jira_log_sprint_evidence.py

      - name: Post ALL Evidence (KIEM-4 to KIEM-39)
        if: ${{ github.event.inputs.action == 'all_evidence' || github.event.inputs.action == 'post_all_evidence' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python scripts/jira_log_all_evidence.py

      - name: Assign ALL Unassigned Issues
        if: ${{ github.event.inputs.action == 'assign_all' || github.event.inputs.action == 'post_all_evidence' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python scripts/jira_assign_all.py

      # ── DANGEROUS actions (create new issues — use with caution!) ──

      - name: "⚠️ Create Jira Issues (CREATES NEW ISSUES)"
        if: ${{ github.event.inputs.action == 'create_issues' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          EPIC_ISSUE_KEY: ${{ github.event.inputs.epic_issue_key }}
        run: |
          python Waste-Recycling-Platform/scripts/create_jira_issues.py

      - name: "⚠️ Distribute Remaining Tasks (CREATES NEW ISSUES)"
        if: ${{ github.event.inputs.action == 'distribute_tasks' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python scripts/create_remaining_tasks.py

      - name: "🧹 Cleanup Duplicate Issues (KIEM-74+)"
        if: ${{ github.event.inputs.action == 'cleanup_duplicates' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python scripts/jira_cleanup_duplicates.py
