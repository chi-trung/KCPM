name: Create Jira Issues

on:
  workflow_dispatch:
    inputs:
      epic_issue_key:
        description: 'Optional existing Epic issue key to link tasks to'
        required: false
        default: ''
      action:
        description: 'Action to perform'
        required: true
        default: 'all_evidence'
        type: choice
        options:
          - create_issues
          - evidence
          - all_evidence
          - distribute_tasks
          - both

jobs:
  jira_automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create Jira Issues
        if: ${{ github.event.inputs.action == 'create_issues' || github.event.inputs.action == 'both' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          EPIC_ISSUE_KEY: ${{ github.event.inputs.epic_issue_key }}
        run: |
          python Waste-Recycling-Platform/scripts/create_jira_issues.py

      - name: Post Sprint Evidence to Jira
        if: ${{ github.event.inputs.action == 'evidence' || github.event.inputs.action == 'both' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python scripts/jira_log_sprint_evidence.py

      - name: Create & Distribute Remaining Tasks
        if: ${{ github.event.inputs.action == 'distribute_tasks' || github.event.inputs.action == 'both' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python scripts/create_remaining_tasks.py

      - name: Post ALL Evidence (Old Issues KIEM-4 to KIEM-31)
        if: ${{ github.event.inputs.action == 'all_evidence' || github.event.inputs.action == 'both' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_EMAIL: ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python scripts/jira_log_all_evidence.py
