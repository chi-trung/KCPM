name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/backend/**/*.csproj'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Restore packages
        run: dotnet restore ".\Waste-Recycling-Platform\backend\tests\WastePlatform.Tests\WastePlatform.Tests.csproj"

      - name: Run tests
        run: >
          dotnet test ".\Waste-Recycling-Platform\backend\tests\WastePlatform.Tests\WastePlatform.Tests.csproj"
          --configuration Release
          --settings ".\Waste-Recycling-Platform\backend\tests\WastePlatform.Tests\WastePlatform.Tests.runsettings"
          --logger "trx;LogFileName=backend-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ".\TestResults"
          --no-restore

      - name: Write Allure environment and executor metadata
        if: always()
        shell: pwsh
        run: |
          $resultsPath = ".\Waste-Recycling-Platform\backend\tests\WastePlatform.Tests\bin\Release\net8.0\allure-results"
          New-Item -ItemType Directory -Force -Path $resultsPath | Out-Null

          # Write environment.properties (key=value per line)
          $envFile = Join-Path $resultsPath "environment.properties"
          "ENV=CI" | Out-File -FilePath $envFile -Encoding utf8
          "DOTNET=$((dotnet --version).Trim())" | Out-File -FilePath $envFile -Append -Encoding utf8
          "GIT_SHA=${{ github.sha }}" | Out-File -FilePath $envFile -Append -Encoding utf8
          "GITHUB_RUN_ID=${{ github.run_id }}" | Out-File -FilePath $envFile -Append -Encoding utf8
          "RUNNER=${{ runner.os }}" | Out-File -FilePath $envFile -Append -Encoding utf8

          # Write executor.json for Executors panel
          $executorFile = Join-Path $resultsPath "executor.json"
          # Write richer executor.json so Allure Executors panel shows full metadata
          $executor = [ordered]@{
            name = "GitHub Actions"
            type = "github"
            url = "https://github.com/${{ github.repository }}"
            buildName = "${{ github.workflow }} #${{ github.run_number }}"
            buildUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            buildOrder = [int]("${{ github.run_number }}")
            reportName = "Allure Report"
            reportUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          $executor | ConvertTo-Json -Depth 5 | Out-File -FilePath $executorFile -Encoding utf8

      - name: Generate Allure report
        if: always()
        run: |
          $resultsPath = ".\Waste-Recycling-Platform\backend\tests\WastePlatform.Tests\bin\Release\net8.0\allure-results"
          $reportPath = ".\TestResults\backend-allure-report"

          if (Test-Path $resultsPath) {
            @(
              "Environment=GitHub Actions",
              "Branch=${{ github.ref_name }}",
              "Workflow=${{ github.workflow }}",
              "RunNumber=${{ github.run_number }}",
              "Commit=${{ github.sha }}"
            ) | Set-Content -Path (Join-Path $resultsPath 'environment.properties') -Encoding utf8

            @{
              name = 'GitHub Actions'
              type = 'github'
              url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              buildOrder = [int]${{ github.run_number }}
              buildName = '${{ github.workflow }} #${{ github.run_number }}'
              reportName = 'WastePlatform Backend Allure Report'
              branch = '${{ github.ref_name }}'
            } | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $resultsPath 'executor.json') -Encoding utf8

            allure generate $resultsPath --clean -o $reportPath
          } else {
            Write-Host "::warning::Allure results folder not found at $resultsPath"
          }

      - name: Write Allure report environment widget
        if: always()
        shell: pwsh
        run: |
          $widgetsPath = ".\TestResults\backend-allure-report\widgets"
          if (-not (Test-Path $widgetsPath)) {
            Write-Host "::warning::Allure widgets folder not found at $widgetsPath"
            exit 0
          }

          $environment = @(
            @{ name = "Branch"; values = @("${{ github.ref_name }}") }
            @{ name = "ENV"; values = @("CI") }
            @{ name = "DOTNET"; values = @((& dotnet --version).Trim()) }
            @{ name = "GIT_SHA"; values = @("${{ github.sha }}") }
            @{ name = "GITHUB_RUN_ID"; values = @("${{ github.run_id }}") }
            @{ name = "RUNNER"; values = @("${{ runner.os }}") }
          )

          $environmentFile = Join-Path $widgetsPath "environment.json"
          $environment | ConvertTo-Json -Depth 5 | Out-File -FilePath $environmentFile -Encoding utf8

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/
          retention-days: 30

      - name: Generate Code Coverage Report
        if: always()
        shell: pwsh
        run: |
          # Install ReportGenerator for HTML coverage report
          dotnet tool install --global dotnet-reportgenerator-globaltool 2>$null

          # Find coverage XML file (generated by --collect:"XPlat Code Coverage")
          $coverageFile = Get-ChildItem -Recurse -Path ".\TestResults" -Filter "coverage.cobertura.xml" | Select-Object -First 1

          if ($coverageFile) {
            Write-Host "Found coverage file: $($coverageFile.FullName)"

            # Generate HTML report
            reportgenerator `
              "-reports:$($coverageFile.FullName)" `
              "-targetdir:.\TestResults\coverage-report" `
              "-reporttypes:HtmlInline_AzurePipelines;Badges;TextSummary;JsonSummary" `
              "-title:WastePlatform Backend Coverage"

            # Parse TextSummary for numbers
            $summaryFile = ".\TestResults\coverage-report\Summary.txt"
            if (Test-Path $summaryFile) {
              $summaryText = Get-Content $summaryFile -Raw
              Write-Host "=== CODE COVERAGE SUMMARY ==="
              Write-Host $summaryText
              Write-Host "============================="

              # Extract line and branch coverage percentages
              $lineMatch = [regex]::Match($summaryText, 'Line coverage:\s*([\d.]+)%')
              $branchMatch = [regex]::Match($summaryText, 'Branch coverage:\s*([\d.]+)%')
              $methodMatch = [regex]::Match($summaryText, 'Method coverage:\s*([\d.]+)%')

              $lineCov = if ($lineMatch.Success) { $lineMatch.Groups[1].Value } else { "N/A" }
              $branchCov = if ($branchMatch.Success) { $branchMatch.Groups[1].Value } else { "N/A" }
              $methodCov = if ($methodMatch.Success) { $methodMatch.Groups[1].Value } else { "N/A" }

              # Set outputs for use in summary
              "LINE_COVERAGE=$lineCov" | Out-File -FilePath $env:GITHUB_ENV -Append
              "BRANCH_COVERAGE=$branchCov" | Out-File -FilePath $env:GITHUB_ENV -Append
              "METHOD_COVERAGE=$methodCov" | Out-File -FilePath $env:GITHUB_ENV -Append

              Write-Host "Line Coverage: $lineCov%"
              Write-Host "Branch Coverage: $branchCov%"
              Write-Host "Method Coverage: $methodCov%"
            }

            # Generate badge JSON for shields.io
            $badgeDir = ".\TestResults\coverage-report"
            if ($branchCov -ne "N/A") {
              $branchNum = [double]$branchCov
              $color = if ($branchNum -ge 80) { "brightgreen" } elseif ($branchNum -ge 60) { "yellow" } else { "red" }
              $badge = @{
                schemaVersion = 1
                label = "branch coverage"
                message = "$branchCov%"
                color = $color
              } | ConvertTo-Json
              $badge | Out-File -FilePath "$badgeDir\coverage-badge.json" -Encoding utf8
            }
          } else {
            Write-Host "::warning::No coverage file found. Coverage report skipped."
            "LINE_COVERAGE=N/A" | Out-File -FilePath $env:GITHUB_ENV -Append
            "BRANCH_COVERAGE=N/A" | Out-File -FilePath $env:GITHUB_ENV -Append
            "METHOD_COVERAGE=N/A" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: TestResults/coverage-report/
          retention-days: 30

      - name: Publish coverage badge to gh-pages
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        run: |
          # Save badge files to a temp location OUTSIDE the repo
          $tempBadges = "$env:RUNNER_TEMP\badges"
          New-Item -ItemType Directory -Force -Path $tempBadges | Out-Null

          # Copy/create coverage badge JSON files
          $badgeFile = ".\TestResults\coverage-report\coverage-badge.json"
          if (Test-Path $badgeFile) {
            Copy-Item $badgeFile "$tempBadges\coverage-badge.json"
          }

          # Create line coverage badge
          $lineCov = $env:LINE_COVERAGE
          if ($lineCov -and $lineCov -ne "N/A") {
            $lineNum = [double]$lineCov
            $lineColor = if ($lineNum -ge 80) { "brightgreen" } elseif ($lineNum -ge 60) { "yellow" } else { "red" }
            @{ schemaVersion = 1; label = "line coverage"; message = "$lineCov%"; color = $lineColor } | ConvertTo-Json | Out-File "$tempBadges\line-coverage-badge.json" -Encoding utf8
          }

          # Create method coverage badge
          $methodCov = $env:METHOD_COVERAGE
          if ($methodCov -and $methodCov -ne "N/A") {
            $methodNum = [double]$methodCov
            $methodColor = if ($methodNum -ge 80) { "brightgreen" } elseif ($methodNum -ge 60) { "yellow" } else { "red" }
            @{ schemaVersion = 1; label = "method coverage"; message = "$methodCov%"; color = $methodColor } | ConvertTo-Json | Out-File "$tempBadges\method-coverage-badge.json" -Encoding utf8
          }

          # Clean checkout of gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages

          # Copy badges from temp
          New-Item -ItemType Directory -Force -Path badges | Out-Null
          Copy-Item "$tempBadges\*" "badges\" -Force -ErrorAction SilentlyContinue

          git add badges/
          $changes = git diff --staged --name-only
          if ($changes) {
            git commit -m "ci: update coverage badges [skip ci]"
            git push origin gh-pages
            Write-Host "Coverage badges published to gh-pages/badges/"
          } else {
            Write-Host "No badge changes to publish"
          }

          # Switch back to main
          git checkout main

      - name: Write GitHub Actions Step Summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter "*.trx" | Select-Object -First 1
          $passed = 0; $failed = 0; $total = 0; $dur = "N/A"
          if ($trx) {
            [xml]$x = Get-Content $trx.FullName
            $counters = $x.TestRun.ResultSummary.Counters
            if ($counters) {
              $passed = [int]($counters.passed)
              $failed = [int]($counters.failed)
              $total  = [int]($counters.total)
            }
            $ts = $x.TestRun.Times
            if ($ts -and $ts.start -and $ts.finish) {
              $sec = [math]::Round(([datetime]$ts.finish - [datetime]$ts.start).TotalSeconds)
              $m = [math]::Floor($sec / 60); $s = $sec % 60
              $dur = if ($m -gt 0) { "${m}m ${s}s" } else { "${s}s" }
            }
          }
          $rate = if ($total -gt 0) { "$([math]::Round($passed/$total*100,1))%" } else { "N/A" }
          $emoji = if ($failed -eq 0 -and $total -gt 0) { "✅" } elseif ($failed -gt 0) { "❌" } else { "⚠️" }
          $status = if ($failed -eq 0 -and $total -gt 0) { "**PASSED**" } elseif ($failed -gt 0) { "**FAILED**" } else { "NO DATA" }

          $summary = @"
          ## $emoji Backend Tests — Run #${{ github.run_number }}

          | Metric | Value |
          |--------|-------|
          | Status | $status |
          | ✅ Passed | $passed |
          | ❌ Failed | $failed |
          | 📊 Total | $total |
          | 🎯 Pass Rate | $rate |
          | ⏱ Duration | $dur |
          | 📈 Line Coverage | ${{ env.LINE_COVERAGE }}% |
          | 🌿 Branch Coverage | ${{ env.BRANCH_COVERAGE }}% |
          | 🔧 Method Coverage | ${{ env.METHOD_COVERAGE }}% |
          | 🌿 Branch | ``${{ github.ref_name }}`` |
          | 🔖 Commit | ``${{ github.sha }}`` |

          ### 📋 KIEM Issues Covered by this Run

          | KIEM Issue | Module | Assignee |
          |-----------|--------|----------|
          | KIEM-4 | Auth Module | Nguyễn Chí Trung |
          | KIEM-5 | Reports Module | Minh Phụng |
          | KIEM-6 | Notifications Module | Nguyễn Hoàng Phụng |
          | KIEM-7 | Complaints Module | Thanh Duy |
          | KIEM-8 | Admin Module | Đăng |
          | KIEM-9 | Analytics Module | Đăng |
          | KIEM-10 | Public Analytics | Thanh Duy |
          | KIEM-12 | WasteCategory Module | Nguyễn Hoàng Phụng |
          | KIEM-13 | Citizen Module | Đăng |
          | KIEM-15 | CollectorTask Module | Minh Phụng |
          | KIEM-16 | Enterprise Task Module | Nguyễn Chí Trung |
          | KIEM-17 | Enterprise Reward Rules | Nguyễn Chí Trung |
          | KIEM-18 | CollectionTask/Image | Thanh Duy |
          | KIEM-19 | SignalR Real-time | Nguyễn Chí Trung |
          | KIEM-20 | File Uploads & Storage | Minh Phụng |
          | KIEM-22 | AuditLog & Error Paths | Thanh Duy |
          | KIEM-23 | Search, Pagination & Filters | Đăng |

          ### 🔗 Links
          - [📊 Allure Report](https://chi-trung.github.io/KCPM/report-main/)
          - Jira Board
          - [🔧 GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Log test results to Jira
        if: always()
        shell: pwsh
        env:
          JIRA_BASE_URL:    ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:       ${{ secrets.JIRA_API_EMAIL }}
          JIRA_API_TOKEN:   ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: KIEM
          TEST_TYPE:        backend
          ALLURE_REPORT_URL: https://chi-trung.github.io/KCPM/report-main/
          GITHUB_RUN_ID:    ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME:  ${{ github.ref_name }}
          GITHUB_SHA:       ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW:  ${{ github.workflow }}
          PR_TITLE:         ${{ github.event.pull_request.title || '' }}
        run: |
          # Parse TRX for pass/fail counts
          $trx = Get-ChildItem -Recurse -Filter "*.trx" | Select-Object -First 1
          $passed = 0; $failed = 0; $total = 0; $dur = ""
          if ($trx) {
            [xml]$x = Get-Content $trx.FullName
            $counters = $x.TestRun.ResultSummary.Counters
            if ($counters) {
              $passed = [int]($counters.passed)
              $failed = [int]($counters.failed)
              $total  = [int]($counters.total)
            }
            $ts = $x.TestRun.Times
            if ($ts -and $ts.start -and $ts.finish) {
              $dur = [math]::Round(([datetime]$ts.finish - [datetime]$ts.start).TotalSeconds)
            }
          }
          $env:PASSED       = $passed
          $env:FAILED       = $failed
          $env:TOTAL        = $total
          $env:DURATION_SEC = $dur
          python scripts/jira_log_test_execution.py
          exit 0

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: |
            Waste-Recycling-Platform/backend/tests/WastePlatform.Tests/bin/Release/net8.0/allure-results
            TestResults/backend-allure-report
            TestResults/allure-history
            Waste-Recycling-Platform/allure-history
          retention-days: 30
