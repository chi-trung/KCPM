name: Generate and publish Allure PDFs (manual)

on:
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright and http-server
        run: |
          npm init -y
          npm i -D playwright http-server
          npx playwright install --with-deps

      - name: Generate PDFs from published HTML
        run: |
          set -e
          ROOT=$(pwd)
          # serve main report if present
          if [ -d "report-main" ]; then npx http-server report-main -p 8080 & fi
          # serve owners if present
          if [ -d "report-extra/owners" ]; then npx http-server report-extra/owners -p 8081 & fi
          sleep 2
          node -e "(async()=>{const {chromium}=require('playwright');const fs=require('fs');const path=require('path');const browser=await chromium.launch();const page=await browser.newPage();if(fs.existsSync('report-main/index.html')){await page.goto('http://127.0.0.1:8080/index.html',{waitUntil:'networkidle'});await page.pdf({path:'report-main/report.pdf',format:'A4',printBackground:true});}const ownersRoot='report-extra/owners';if(fs.existsSync(ownersRoot)){for(const d of fs.readdirSync(ownersRoot)){const idx=path.join(ownersRoot,d,'index.html');if(fs.existsSync(idx)){await page.goto('http://127.0.0.1:8081/'+d+'/index.html',{waitUntil:'networkidle'});const out=path.join(ownersRoot,d,'report.pdf');await page.pdf({path:out,format:'A4',printBackground:true});}}}await browser.close();})();"

      - name: Commit generated PDFs back to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A report-main/report.pdf || true
          git add -A report-extra/owners/**/report.pdf || true
          if git diff --staged --quiet; then echo 'No PDF changes to commit'; else git commit -m "chore(reports): publish generated PDFs"; git push origin gh-pages; fi
