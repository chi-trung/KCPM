name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar-backend:
    name: SonarCloud Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Waste-Recycling-Platform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build and Analyze Backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"chi-trung_KCPM_backend" \
            /o:"chi-trung" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/TestResults/**" \
            /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/**/*.xml"
          
          dotnet build Waste-Recycling-Platform.sln
          
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  sonar-frontend:
    name: SonarCloud Frontend & E2E (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: Waste-Recycling-Platform
          args: >
            -Dsonar.projectKey=chi-trung_KCPM_frontend
            -Dsonar.organization=chi-trung
            -Dsonar.sources=frontend/src,frontend/public
            -Dsonar.tests=frontend/e2e
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,frontend/out/**,frontend/output/**,allure-results/**,allure-report/**
            -Dsonar.coverage.exclusions=frontend/e2e/**
            -Dsonar.cpd.exclusions=frontend/e2e/**
