name: Jira Key Enforcement

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title-must-have-jira-key:
    name: PR title must include Jira key
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || "";
            const jiraRegex = /[A-Z][A-Z0-9]+-\d+/;

            core.info(`Checking PR title: "${title}"`);

            if (!jiraRegex.test(title)) {
              core.setFailed(
                "PR title must include a Jira key, for example: KIEM-123 - Implement report validation"
              );
              return;
            }

            core.info("PR title check passed.");

  commits-must-have-jira-key:
    name: All commits in PR must include Jira key
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit messages in PR
        uses: actions/github-script@v7
        with:
          script: |
            const jiraRegex = /[A-Z][A-Z0-9]+-\d+/;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner,
                repo,
                pull_number,
                per_page: 100,
              }
            );

            core.info(`Found ${commits.length} commit(s) in PR #${pull_number}`);

            if (commits.length === 0) {
              core.setFailed("No commits found in the pull request.");
              return;
            }

            const invalid = [];

            for (const c of commits) {
              const sha = c.sha?.slice(0, 7) || "unknown";
              const message = c.commit?.message || "";
              const firstLine = message.split("\n")[0];

              // Skip merge commits (auto-generated by GitHub, never contain Jira keys)
              if (firstLine.startsWith("Merge pull request") || firstLine.startsWith("Merge branch")) {
                core.info(`Skipping merge commit ${sha}: ${firstLine}`);
                continue;
              }

              if (!jiraRegex.test(message)) {
                invalid.push(`- ${sha}: ${firstLine}`);
              }
            }

            if (invalid.length > 0) {
              core.setFailed(
                [
                  "The following commit messages are missing Jira keys:",
                  ...invalid,
                  "",
                  "Use format like: KIEM-123: short description",
                ].join("\n")
              );
              return;
            }

            core.info("All commit messages include Jira keys.");
