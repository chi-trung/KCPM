# SonarCloud Configuration for Frontend and E2E
# Note: Backend (.NET) is configured explicitly in the CI workflow via dotnet-sonarscanner

sonar.projectKey=chi-trung_KCPM_frontend
sonar.organization=chi-trung

# --- Explicit Scoping ---
# Analyze all frontend source code
sonar.sources=frontend/src, frontend/public
# Explicitly include E2E as test code. This allows Sonar to analyze code quality (smells, bugs)
# in your test scripts without confusing them with production code.
sonar.tests=frontend/e2e

# --- Noise Reduction ---
# Exclude build artifacts, generated files, and external libraries
sonar.exclusions=**/node_modules/**, **/.next/**, frontend/out/**, frontend/output/**, allure-results/**, allure-report/**

# Exclude E2E tests from Coverage and Duplication metrics (prevents noisy quality gate failures)
sonar.coverage.exclusions=frontend/e2e/**
sonar.cpd.exclusions=frontend/e2e/**

# Javascript / Typescript specifics (adjust if you generate coverage reports)
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
