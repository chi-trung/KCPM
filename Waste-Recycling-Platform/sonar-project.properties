sonar.projectKey=chi-trung_KCPM
sonar.organization=chi-trung
sonar.projectName=KCPM (Waste Recycling Platform)
sonar.projectVersion=1.0

# Sources — both frontend (TypeScript/React) and backend (C#/.NET 8)
sonar.sources=frontend/src,backend/src
sonar.tests=frontend/src
sonar.test.inclusions=frontend/src/**/__tests__/**/*.tsx,frontend/src/**/__tests__/**/*.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.test.ts

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  frontend/out/**,\
  frontend/output/**,\
  allure-results/**,\
  allure-report/**,\
  **/coverage/**,\
  **/*.min.js,\
  db/migrations/**,\
  scripts/**,\
  **/bin/**,\
  **/obj/**,\
  **/TestResults/**,\
  **/Migrations/**

# Coverage report path (generated by vitest --coverage on Linux CI)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Coverage exclusions — components/shared and components/ui have comprehensive unit tests
# All other dirs (app pages, admin/citizen/collector/enterprise/layout) are tested via E2E
sonar.coverage.exclusions=\
  frontend/e2e/**,\
  frontend/src/app/**,\
  frontend/src/components/admin/**,\
  frontend/src/components/citizen/**,\
  frontend/src/components/collector/**,\
  frontend/src/components/enterprise/**,\
  frontend/src/components/layout/**,\
  frontend/src/components/NotificationToast.tsx,\
  frontend/src/lib/**,\
  frontend/src/hooks/**,\
  frontend/src/contexts/**,\
  frontend/src/types/**

sonar.cpd.exclusions=frontend/e2e/**

# Encoding
sonar.sourceEncoding=UTF-8
