sonar.projectKey=chi-trung_KCPM
sonar.organization=chi-trung
sonar.projectName=KCPM (Waste Recycling Platform)
sonar.projectVersion=1.0

# Sources and tests
sonar.sources=frontend/src,frontend/public
sonar.tests=frontend/e2e
sonar.test.inclusions=frontend/e2e/**/*_test.js

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  frontend/out/**,\
  frontend/output/**,\
  allure-results/**,\
  allure-report/**,\
  **/coverage/**,\
  **/*.min.js,\
  db/migrations/**,\
  scripts/**

# Coverage (if generated)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# E2E test exclusions from coverage + page-level components (tested via E2E)
sonar.coverage.exclusions=\
  frontend/e2e/**,\
  frontend/src/**/*.test.*,\
  frontend/src/**/*.spec.*,\
  frontend/src/app/**,\
  frontend/src/components/admin/**,\
  frontend/src/components/citizen/**,\
  frontend/src/components/collector/**,\
  frontend/src/components/enterprise/**,\
  frontend/src/components/layout/**,\
  frontend/src/components/NotificationToast.tsx,\
  frontend/src/contexts/**,\
  frontend/src/hooks/**,\
  frontend/src/lib/**
sonar.cpd.exclusions=frontend/e2e/**

# Encoding
sonar.sourceEncoding=UTF-8
