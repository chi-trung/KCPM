name: Deploy to Render

on:
  # Deploy after Backend Tests pass
  workflow_run:
    workflows: ["Backend Tests"]
    types: [completed]
    branches: [main]
  # Manual trigger
  workflow_dispatch:

concurrency:
  group: deploy-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Backend to Render.com
    runs-on: ubuntu-latest
    # Only deploy if backend tests passed (or manual trigger)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check Render Deploy Hook
        id: check_hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret not set. Skipping deploy."
            echo "To enable: Go to Render Dashboard → Service → Settings → Deploy Hook → Copy URL"
            echo "Then add it as GitHub secret: RENDER_DEPLOY_HOOK_URL"
            echo "has_hook=false" >> $GITHUB_OUTPUT
          else
            echo "has_hook=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Render Deploy
        if: steps.check_hook.outputs.has_hook == 'true'
        run: |
          echo "🚀 Triggering Render deployment..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
            echo "✅ Render deploy triggered successfully (HTTP $RESPONSE)"
          else
            echo "❌ Render deploy trigger failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Wait for Render Deploy
        if: steps.check_hook.outputs.has_hook == 'true'
        run: |
          echo "⏳ Waiting 120s for Render to build and deploy..."
          sleep 120

      - name: Health Check
        if: steps.check_hook.outputs.has_hook == 'true'
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL || 'https://kcpm-backend.onrender.com' }}"
          echo "🏥 Checking backend health at $BACKEND_URL/api/health..."

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/health" --max-time 10)
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Backend is healthy! (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: HTTP $RESPONSE — retrying in 30s..."
            sleep 30
          done

          echo "❌ Backend health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Deployment Summary
        if: always() && steps.check_hook.outputs.has_hook == 'true'
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 Render Deployment

          | Metric | Value |
          |--------|-------|
          | **Trigger** | Backend Tests passed |
          | **Service** | kcpm-backend (Render.com) |
          | **Branch** | `main` |
          | **Commit** | `${{ github.sha }}` |
          | **Backend URL** | https://kcpm-backend.onrender.com |
          | **API Health** | https://kcpm-backend.onrender.com/api/health |
          | **Frontend URL** | https://kcpm.vercel.app |

          ### 📋 Setup Instructions (nếu chưa config)

          1. **Render.com**: Tạo Web Service → Docker → Connect GitHub repo
          2. **Deploy Hook**: Service → Settings → Deploy Hook → Copy URL
          3. **GitHub Secret**: Add `RENDER_DEPLOY_HOOK_URL` = Deploy Hook URL
          4. **Database**: Tạo MySQL trên PlanetScale/Railway → Set `ConnectionStrings__DefaultConnection`
          EOF

      - name: Skip Summary
        if: steps.check_hook.outputs.has_hook == 'false'
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## ⚠️ Render Deployment Skipped

          Missing `RENDER_DEPLOY_HOOK_URL` secret. To enable auto-deployment:

          1. Go to [Render Dashboard](https://dashboard.render.com)
          2. Select your service → Settings → Deploy Hook
          3. Copy the Deploy Hook URL
          4. Add it as GitHub secret: `RENDER_DEPLOY_HOOK_URL`

          Alternatively, deploy manually from Render Dashboard.
          EOF
