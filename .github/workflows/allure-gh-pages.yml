name: CI - API Tests with Allure Report

on:
  workflow_run:
    workflows:
      - Backend Tests
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: allure-gh-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-api-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start Backend with Docker Compose
        run: |
          cd Waste-Recycling-Platform
          docker compose up -d backend
          echo "Waiting for backend and DB to initialize..."
          sleep 30 # Đợi 30s để đảm bảo db và backend khởi động xong

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman and Allure Reporter
        run: |
          npm install -g newman newman-reporter-allure

      - name: Run Postman Tests via Newman
        continue-on-error: true # Cho phép job tiếp tục ngay cả khi có test case bị fail
        run: |
          cd Waste-Recycling-Platform
          newman run "postman/WastePlatform API - Professional QA Suite.postman_collection.json" \
            -e "postman/WastePlatform.professional.postman_environment.json" \
            -r allure \
            --reporter-allure-export allure-results

      - name: Checkout gh-pages history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Fetch backend-tests Allure artifact
        if: always()
        run: |
          set -e
          echo "Looking for latest successful backend-tests workflow run on main..."
          OWNER_REPO=${{ github.repository }}
          WORKFLOW_FILE=backend-tests.yml
          runs_url="https://api.github.com/repos/${OWNER_REPO}/actions/workflows/${WORKFLOW_FILE}/runs?branch=main&status=success"
          runs_resp=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "$runs_url")
          # Extract first run id without jq
          run_id=$(echo "$runs_resp" | grep -o '"id": [0-9]\+' | head -n1 | sed -E 's/"id": //')
          if [ -z "$run_id" ]; then
            echo "No successful backend-tests run found; skipping artifact fetch"
            exit 0
          fi
          echo "Found backend-tests run: $run_id"
          arts_url="https://api.github.com/repos/${OWNER_REPO}/actions/runs/${run_id}/artifacts"
          arts_resp=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "$arts_url")
          # Find artifact id matching 'allure-results' without jq
          art_id=$(echo "$arts_resp" | grep -o '"id": [0-9]\+\|"name": "[^"]\+' | paste - - | grep 'allure-results' | head -n1 | sed -E 's/.*"id": ([0-9]+)\s+"name": .*/\1/')
          if [ -z "$art_id" ]; then
            echo "No allure-results artifact found in run $run_id; skipping"
            exit 0
          fi
          echo "Found artifact id: $art_id -- downloading..."
          download_url="https://api.github.com/repos/${OWNER_REPO}/actions/artifacts/${art_id}/zip"
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "$download_url" -o artifact.zip
          unzip -o artifact.zip -d backend_artifact || true
          # Try to locate any folder named allure-results inside the artifact and copy its contents
          found=0
          for d in backend_artifact/*; do
            if [ -d "$d" ]; then
              # find any directory named allure-results under this path
              src=$(find "$d" -type d -name allure-results | head -n1 || true)
              if [ -n "$src" ] && [ -d "$src" ]; then
                echo "Copying backend results from $src into Waste-Recycling-Platform/allure-results"
                mkdir -p Waste-Recycling-Platform/allure-results
                cp -R "$src"/* Waste-Recycling-Platform/allure-results/ || true
                found=1
                break
              fi
            fi
          done
          if [ $found -eq 0 ]; then
            echo "No known results folder found inside artifact"
          fi
          rm -rf artifact.zip backend_artifact || true

      - name: Restore Allure History
        if: always()
        run: |
          mkdir -p Waste-Recycling-Platform/allure-results/history
          if [ -d gh-pages/last-history ]; then
            cp -R gh-pages/last-history/. Waste-Recycling-Platform/allure-results/history/
          elif [ -d gh-pages/history ]; then
            cp -R gh-pages/history/. Waste-Recycling-Platform/allure-results/history/
          fi

      - name: Write Allure Environment
        if: always()
        run: |
          mkdir -p Waste-Recycling-Platform/allure-results
          cat > Waste-Recycling-Platform/allure-results/environment.properties <<EOF
          GIT_BRANCH=${{ github.ref }}
          GIT_COMMIT=${{ github.sha }}
          RUN_ID=${{ github.run_id }}
          RUN_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_NUMBER=${{ github.run_number }}
          RUNNER_OS=${{ runner.os }}
          WORKFLOW=${{ github.workflow }}
          EOF

      - name: Write executor metadata
        if: always()
        run: |
          mkdir -p Waste-Recycling-Platform/allure-results
          cat > Waste-Recycling-Platform/allure-results/executor.json <<'EOF'
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}",
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Allure Report",
            "reportUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Write Allure categories
        if: always()
        run: |
          mkdir -p Waste-Recycling-Platform/allure-results
          if [ -f Waste-Recycling-Platform/allure-categories.json ]; then
            cp Waste-Recycling-Platform/allure-categories.json Waste-Recycling-Platform/allure-results/categories.json
          fi

      - name: Sync Jira Owners
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python3 Waste-Recycling-Platform/scripts/sync_jira_owners.py

      - name: Inject owners into raw Allure results
        if: always()
        run: |
          python3 Waste-Recycling-Platform/scripts/inject_owners_into_results.py || true

      - name: Debug merged allure results
        if: always()
        run: |
          echo "===== ALLURE RESULTS TREE ====="
          find Waste-Recycling-Platform/allure-results -type f | sort | head -200 || true

          echo "===== JSON COUNT ====="
          find Waste-Recycling-Platform/allure-results -name "*.json" | wc -l || true

          echo "===== SAMPLE FILES ====="
          ls -lah Waste-Recycling-Platform/allure-results | head -50 || true

          echo "===== HISTORY ====="
          find Waste-Recycling-Platform/allure-results/history -maxdepth 2 -type f || true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: Waste-Recycling-Platform/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: Waste-Recycling-Platform/allure-results/history
          keep_reports: 20

      - name: Debug generated report
        if: always()
        run: |
          echo "===== GENERATED REPORT ====="
          find allure-report -type f | head -100 || true

      - name: Install Allure CLI for per-owner reports
        if: always()
        run: |
          npm install -g allure-commandline@2.13.0 || true

      - name: Generate per-owner Allure reports
        if: always()
        run: |
          python3 Waste-Recycling-Platform/scripts/generate_per_owner_reports.py

      - name: Prepare validation temp directory
        if: always()
        run: |
          rm -rf validation-temp || true
          mkdir -p validation-temp

      - name: Create validation artifacts for Pages
        if: always()
        run: |
          set -e
          # copy jira-owner-map if present
          if [ -f Waste-Recycling-Platform/allure-results/jira-owner-map.json ]; then
            cp Waste-Recycling-Platform/allure-results/jira-owner-map.json validation-temp/jira-owner-map.json
          fi
          # create JSON summary with resolved counts and sample entries
            python3 - <<'PY'
            import json, os
            out_dir='validation-temp'
            src='Waste-Recycling-Platform/allure-results/jira-owner-map.json'
            summary={'resolved':0,'total':0,'sample':{}}
            if os.path.exists(src):
              with open(src,'r',encoding='utf8') as f:
                m=json.load(f)
              summary['total']=len(m)
              for k,v in list(m.items())[:20]:
                if v and not v.get('unassigned'):
                  summary['resolved']+=1
                summary['sample'][k]=v
            with open(os.path.join(out_dir,'summary.json'),'w',encoding='utf8') as f:
              json.dump(summary,f,ensure_ascii=False,indent=2)
            print('Wrote validation summary to',os.path.join(out_dir,'summary.json'))
            PY
          # list generated owner slugs
          if [ -d allure-report/owners ]; then
            ls -1 allure-report/owners > validation-temp/owner-slugs.txt || true
          else
            echo "" > validation-temp/owner-slugs.txt
          fi
          # print Pages urls
          OWNER_REPO=${{ github.repository }}
          OWNER=$(echo "$OWNER_REPO" | cut -d'/' -f1)
          REPO=$(echo "$OWNER_REPO" | cut -d'/' -f2)
          echo "Main report: https://$OWNER.github.io/$REPO/" > validation-temp/urls.txt
          echo "Owners base: https://$OWNER.github.io/$REPO/owners/" >> validation-temp/urls.txt
          echo "Wrote Pages URLs to validation-temp/urls.txt"

      - name: Validate results and build validation page
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
            python3 - <<'PY'
            import json
            import os
            import re
            import sys
            from pathlib import Path

            results_dir = Path('Waste-Recycling-Platform/allure-results')
            validation_dir = Path('validation-temp')
            validation_dir.mkdir(parents=True, exist_ok=True)

            summary = {
              'jira_resolved': 0,
              'jira_total': 0,
              'jira_sample': {},
              'injected_count': 0,
              'owners': [],
              'owner_slugs': [],
              'owner_folders': [],
              'xunit_present': False,
              'postman_present': False,
              'history_exists': (Path('allure-report') / 'history').exists(),
              'categories_exists': (results_dir / 'categories.json').exists(),
              'executor_exists': (results_dir / 'executor.json').exists(),
            }

            jira_map_path = results_dir / 'jira-owner-map.json'
            if not jira_map_path.exists():
              print('Fail: jira-owner-map is empty')
              sys.exit(2)

            jira_map = json.loads(jira_map_path.read_text(encoding='utf8'))
            summary['jira_total'] = len(jira_map)
            if summary['jira_total'] == 0:
              print('Fail: jira-owner-map is empty')
              sys.exit(2)

            for i, (key, value) in enumerate(jira_map.items()):
              if i < 10:
                summary['jira_sample'][key] = value
              if value and not value.get('unassigned'):
                summary['jira_resolved'] += 1

            for json_file in results_dir.glob('*.json'):
              try:
                data = json.loads(json_file.read_text(encoding='utf8'))
              except Exception:
                continue
              if not isinstance(data, dict):
                continue
              labels = [label for label in (data.get('labels') or []) if isinstance(label, dict)]
              for label in labels:
                if label.get('name') == 'owner' and label.get('value'):
                  summary['injected_count'] += 1
                  summary['owners'].append(label.get('value'))
              package_values = [label.get('value') for label in labels if label.get('name') in ('package', 'suite', 'subSuite')]
              joined = ' '.join(str(value) for value in package_values)
              if 'WastePlatform.Tests' in joined or '.Tests.' in joined or 'WastePlatform' in joined:
                summary['xunit_present'] = True
              if 'Postman' in joined or 'postman' in joined or 'newman' in joined:
                summary['postman_present'] = True

            summary['owners'] = sorted(set(summary['owners']))
            summary['owner_slugs'] = [re.sub(r'[^a-z0-9]+', '-', owner.lower()).strip('-') for owner in summary['owners']]
            for slug in summary['owner_slugs']:
              folder = Path('allure-report') / 'owners' / slug
              if folder.exists():
                summary['owner_folders'].append(str(folder))

            print('--- CI Validation Summary ---')
            print(f"Jira issues resolved count: {summary['jira_resolved']} of {summary['jira_total']}")
            print('First 10 jira-owner-map entries:')
            print(json.dumps(summary['jira_sample'], ensure_ascii=False, indent=2))
            print(f"Injected owner count: {summary['injected_count']}")
            print(f"Discovered owners: {summary['owners']}")
            print(f"Generated owner slugs: {summary['owner_slugs']}")
            print(f"Generated /owners/<slug> folders: {summary['owner_folders']}")

            if summary['jira_total'] == 0:
              print('Fail: jira-owner-map is empty')
              sys.exit(3)
            if not summary['owner_slugs']:
              print('Fail: no owner slugs generated')
              sys.exit(4)
            if summary['injected_count'] == 0:
              print('Fail: owner injection modified 0 files')
              sys.exit(5)
            if not summary['xunit_present']:
              print('Fail: xUnit results missing')
              sys.exit(6)
            if not summary['postman_present']:
              print('Fail: only Postman suite exists')
              sys.exit(7)

            repo_owner, repo_name = os.environ['GITHUB_REPOSITORY'].split('/')
            main_url = f'https://{repo_owner}.github.io/{repo_name}/'
            print(f'Report URL: {main_url}')

            with open(validation_dir / 'summary.json', 'w', encoding='utf8') as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)

            with open(validation_dir / 'index.html', 'w', encoding='utf8') as html:
              html.write('<!doctype html><html><head><meta charset="utf-8"><title>Allure Validation</title></head><body>')
              html.write(f'<h1>Allure Validation for run {os.environ.get("GITHUB_RUN_ID")}</h1>')
              html.write(f'<p>Main report URL: <a href="{main_url}">{main_url}</a></p>')
              html.write('<h2>Jira sync</h2>')
              html.write(f'<p>Status: OK</p>')
              html.write(f'<p>Issues resolved: {summary["jira_resolved"]} of {summary["jira_total"]}</p>')
              html.write('<h2>Owners</h2><ul>')
              for slug, owner in zip(summary['owner_slugs'], summary['owners']):
                html.write(f'<li><a href="{main_url}owners/{slug}/">{owner}</a></li>')
              html.write('</ul>')
              html.write('<h2>Checks</h2><ul>')
              html.write(f'<li>xUnit merged: {summary["xunit_present"]}</li>')
              html.write(f'<li>Postman merged: {summary["postman_present"]}</li>')
              html.write(f'<li>history exists: {summary["history_exists"]}</li>')
              html.write(f'<li>categories exists: {summary["categories_exists"]}</li>')
              html.write(f'<li>executor exists: {summary["executor_exists"]}</li>')
              html.write('</ul></body></html>')

            with open(validation_dir / 'owner-slugs.txt', 'w', encoding='utf8') as f:
              f.write('\n'.join(summary['owner_slugs']) + ('\n' if summary['owner_slugs'] else ''))

            with open(validation_dir / 'urls.txt', 'w', encoding='utf8') as f:
              f.write(f'Main report: {main_url}\n')
              f.write(f'Validation page: {main_url}validation/\n')
              for slug in summary['owner_slugs']:
                f.write(f'Owner: {main_url}owners/{slug}/\n')

            print(f'Validation page URL: {main_url}validation/')
            PY
            PY
          mkdir -p allure-report || true
          rm -rf allure-report/validation || true
          cp -r validation-temp allure-report/validation
            PY

      - name: Deploy to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true

      - name: Persist last-history to gh-pages
        if: always() && github.event_name != 'pull_request'
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf gh-pages/last-history || true
          mkdir -p gh-pages/last-history
          if [ -d allure-report/history ]; then
            cp -R allure-report/history/. gh-pages/last-history/ || true
          fi
          cd gh-pages
          git add -A
          if git diff --staged --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "Update last-history from run ${{ github.run_id }}"
            echo "Attempting push to gh-pages (with fetch+rebase strategy)"
            set +e
            git fetch origin gh-pages
            git pull --rebase origin gh-pages || true
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:gh-pages
            status=$?
            if [ $status -ne 0 ]; then
              echo "Push failed (status=$status). Retrying once with rebase and push..."
              git pull --rebase origin gh-pages || true
              git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:gh-pages
              status2=$?
              if [ $status2 -ne 0 ]; then
                echo "Second push attempt failed (status=$status2). Exiting with non-zero to surface failure."
                exit $status2
              fi
            fi
            set -e
          fi
